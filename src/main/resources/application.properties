spring.application.name=biblioteca

# Puerto
server.port=8080

# Configuración Base de Datos (PostgreSQL - AWS RDS)
# Se puede sobrescribir con variables de entorno DB_URL, DB_USERNAME y DB_PASSWORD (o archivo .env)
spring.datasource.url=${DB_URL:jdbc:postgresql://db-ate-postgres.cdeg4qsca5us.us-east-2.rds.amazonaws.com/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:qscax123#}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# JWT Secret y Expiration
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=${JWT_EXPIRATION:86400000}

# IA - Google Gemini (embeddings del chatbot)
# La API key NO se sube a git: se pasa con la variable de entorno GEMINI_API_KEY
gemini.api-key=${GEMINI_API_KEY:}
gemini.embedding.model=${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
gemini.embedding.dimensions=${GEMINI_EMBEDDING_DIMENSIONS:1536}
gemini.reintentos=${GEMINI_REINTENTOS:3}

# LLM del chatbot (API compatible con OpenAI: DeepSeek, GLM en Huawei ModelArts, OpenRouter...)
# La API key NO se sube a git: se pasa con la variable de entorno LLM_API_KEY
llm.api-key=${LLM_API_KEY:}
llm.base-url=${LLM_BASE_URL:https://api.deepseek.com}
llm.chat.model=${LLM_CHAT_MODEL:deepseek-chat}
llm.reintentos=${LLM_REINTENTOS:3}

# Chatbot de recomendaciones
chatbot.candidatos=${CHATBOT_CANDIDATOS:6}
chatbot.peso.mensaje=${CHATBOT_PESO_MENSAJE:0.6}
